# Local dev overrides. Docker Compose merges this into docker-compose.yml
# automatically, so `docker compose up` picks it up with no extra flags.
#
# The frontend swaps to the Vite dev server for HMR. The API has no dev layer:
# it runs the same release image as the base file and is rebuilt on change,
# so only its environment differs here.
services:
  api-wizards:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    # The connection string is deliberately not overridden. The container runs
    # the release image, whose only writable data directory is /app/data.
    restart: "no"

  web-wizards:
    build:
      dockerfile: Dockerfile.dev
    image: wizards/web:dev
    volumes:
      # Source bind mount drives the Vite dev server's HMR.
      - ./frontend/web:/app
      # Anonymous volume keeps the host's node_modules from clobbering the
      # container's Linux-built dependencies.
      - /app/node_modules
    restart: "no"
